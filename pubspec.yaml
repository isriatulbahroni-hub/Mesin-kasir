name: kasir_pro
description: "Kasir Pro — Aplikasi Kasir/POS untuk UMKM Indonesia"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.7
  supabase_flutter: ^2.5.11
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  fl_chart: ^0.68.0
  intl: ^0.19.0
  print_bluetooth_thermal: ^1.1.1
  esc_pos_utils_plus: ^2.0.4
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.2
  uuid: ^4.5.0
  equatable: ^2.0.5
  image_picker: ^1.1.2
  mobile_scanner: ^6.0.2
  sqflite: ^2.3.3+1
  path: ^1.9.0
  share_plus: ^10.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
